[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

# Redirect all routes to index.html (for React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy API requests to your backend
[[redirects]]
  from = "/api/*"
  to = "https://mailflow-interview-sys-production-2001.up.railway.app/api/:splat"
  status = 200
  force = true
